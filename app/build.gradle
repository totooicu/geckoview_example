plugins {
    id 'com.android.application'
}

/** 打包时的最后一次 git 提交（短哈希）：注入 BuildConfig.GIT_COMMIT，
 *  getEnv() 报给网页——壳发出去就收不回来，版本条要能说出「跑的是哪份代码」。 */
def gitCommitShort() {
    try {
        // Gradle 9 移除了 Project.exec()，用纯 Java 的 ProcessBuilder。
        def p = new ProcessBuilder("git", "rev-parse", "--short", "HEAD")
        p.redirectErrorStream(true)
        def proc = p.start()
        def s = proc.inputStream.text.trim()
        proc.waitFor()
        return s ?: "unknown"
    } catch (Exception ignored) {
        return "unknown"
    }
}

android {
    namespace = 'org.mozilla.geckoview_example'
    compileSdk {
        version = release(37) { minorApiLevel = 2 }
    }

    defaultConfig {
        applicationId "org.mozilla.geckoview_example"
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName "1.1.1"
        // 版本时间：写死为「提交 GitHub 的时间」（Asia/Shanghai），发版流程见
        // CLAUDE.md「版本对齐」：push 到 GitHub 后，把该提交时间更新到这里，
        // 网页经 getEnv().builtAt 查询，版本条显示「壳 1.1.1（10-25 21:47 @ …）」。
        // 当前值对应提交 18ad673（2026-10-25 21:47:01 +08:00）。
        buildConfigField "String", "BUILD_TIME", "\"2026-10-25 21:47\""
        // git 短哈希：构建时动态取当前 HEAD（Gradle 9 移除了 Project.exec，
        // 用 ProcessBuilder；无 git 环境的机器会得到 "unknown"，需在发版机构建）。
        buildConfigField "String", "GIT_COMMIT", "\"${gitCommitShort()}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 用同一把钥匙签 release：换钥匙等于换 App——已装的版本无法升级，
            // 只能卸载重装，而卸载会连同 WebView 里的本地数据一起清掉。
            // v1.0.0 起钥匙固定，密钥文件由用户保管、不进库。
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.annotation:annotation:1.8.2'
}
