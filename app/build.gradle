plugins {
    id 'com.android.application'
}

/** 打包时的最后一次 git 提交（短哈希）：注入 BuildConfig.GIT_COMMIT，
 *  getEnv() 报给网页——壳发出去就收不回来，版本条要能说出「跑的是哪份代码」。 */
def gitCommitShort() {
    try {
        // Gradle 9 移除了 Project.exec()，用纯 Java 的 ProcessBuilder。
        def p = new ProcessBuilder("git", "rev-parse", "--short", "HEAD")
        p.redirectErrorStream(true)
        def proc = p.start()
        def s = proc.inputStream.text.trim()
        proc.waitFor()
        return s ?: "unknown"
    } catch (Exception ignored) {
        return "unknown"
    }
}

android {
    namespace = 'org.mozilla.geckoview_example'
    compileSdk {
        version = release(37) { minorApiLevel = 2 }
    }

    defaultConfig {
        applicationId "org.mozilla.geckoview_example"
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName "1.1.1"
        // 构建时间（Asia/Shanghai）与 git 短哈希：每次打包时刻注入 BuildConfig，
        // getEnv() 报给网页，版本条显示「壳 1.1.1（10-25 17:48 @ a1b2c3d）」。
        // 用 defaultConfig 的 buildConfigField（AGP 公共 DSL），不依赖变体遍历内部 API。
        buildConfigField "String", "BUILD_TIME",
                "\"${new Date().format('yyyy-MM-dd HH:mm', TimeZone.getTimeZone('Asia/Shanghai'))}\""
        buildConfigField "String", "GIT_COMMIT", "\"${gitCommitShort()}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 用同一把钥匙签 release：换钥匙等于换 App——已装的版本无法升级，
            // 只能卸载重装，而卸载会连同 WebView 里的本地数据一起清掉。
            // v1.0.0 起钥匙固定，密钥文件由用户保管、不进库。
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.annotation:annotation:1.8.2'
}
